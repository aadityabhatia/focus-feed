default_language_version:
  python: python3.14

fail_fast: true

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies:
          - av
          - beautifulsoup4
          - click
          - feedgen
          - httpx
          - markdown
          - openai
          - pydantic-settings
          - pydantic
          - pypdf
          - python-dotenv
          - watchdog
