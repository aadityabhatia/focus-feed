[project]
name = "focus-feed"
version = "1.2.1"
description = "Turn course materials into private RSS feeds, with takeaways focused on what you want to learn."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
    { name = "Sonny Bhatia", email = "aadityabhatia@gmail.com" }
]
keywords = [
    "rss",
    "feed",
    "education",
    "podcast",
    "transcription",
    "articles",
    "summarization",
    "llm",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
    "Topic :: Education",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing",
]

dependencies = [
    "feedgen>=1.0.0",
    "watchdog>=7.0.0",
    "openai>=3.42.1",
    "pydantic-settings>=2.16.2",
    "pydantic>=2.14.2",
    "click>=8.5.0",
    "pypdf>=6.21.4",
    "beautifulsoup4>=4.15.0",
    "python-dotenv>=1.2.4",
    "av>=19.0.2",
    "markdown>=3.11.2",
]

[project.urls]
Homepage = "https://github.com/aadityabhatia/focus-feed"
Repository = "https://github.com/aadityabhatia/focus-feed"
Issues = "https://github.com/aadityabhatia/focus-feed/issues"
Documentation = "https://github.com/aadityabhatia/focus-feed"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/focus_feed"]

[project.scripts]
focus-feed = "focus_feed.cli:main"

# ---------------------------------------------------------------------------
# Ruff — linter & formatter
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is fine in tests
    "N806",  # Variable naming (MockProducer, etc. are common in tests)
]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

# ---------------------------------------------------------------------------
# Mypy — static type checker
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "feedgen.*",
    "watchdog.*",
    "markdown.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
