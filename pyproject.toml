[project]
name = "local-feed-generator"
version = "0.1.0"
description = "A local RSS/Atom feed generator for audio, HTML and PDF files"
requires-python = ">=3.14"
dependencies = [
    "feedgen>=1.0.0",
    "watchdog>=3.0.0",
    "openai>=2.48.0",
    "pydantic-settings>=2.15.0",
    "pydantic>=2.12.0",
    "click>=8.5.0",
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "av>=11.0",
    "markdown>=3.5.0",
]

[project.optional-dependencies]
local-transcription = [
    "faster-whisper>=1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["local-feed-generator/src/local_feed_generator"]

[project.scripts]
local-feed-generator = "local_feed_generator.cli:main"

# ---------------------------------------------------------------------------
# Ruff — linter & formatter
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is fine in tests
    "N806",  # Variable naming (MockProducer, etc. are common in tests)
]
"local-feed-generator/tests/**" = [
    "S101",  # assert is fine in tests
    "N806",  # Variable naming (MockProducer, etc. are common in tests)
]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

# ---------------------------------------------------------------------------
# Mypy — static type checker
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "feedgen.*",
    "faster_whisper.*",
    "watchdog.*",
    "markdown.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["local-feed-generator/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
